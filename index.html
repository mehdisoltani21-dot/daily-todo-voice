<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لیست کارهای روزانه صوتی</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f0f9ff 100%);
      min-height: 100vh;
      color: var(--text);
      padding: 20px;
    }

    .container { max-width: 700px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 6px; }
    header p { color: var(--muted); font-size: 0.95rem; }

    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: #eef2ff;
      padding: 6px;
      border-radius: 14px;
    }

    .tab {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab:hover { background: #e0e7ff; color: var(--primary); }
    .tab.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(79,70,229,0.15);
    }

    .tab .count {
      display: inline-block;
      background: #c7d2fe;
      color: var(--primary);
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 10px;
      margin-right: 4px;
    }

    .tab.active .count {
      background: var(--primary);
      color: white;
    }

    .input-section { display: flex; flex-direction: column; gap: 12px; }

    .voice-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--primary); color: white; border: none; border-radius: 12px;
      padding: 16px 24px; font-size: 1.1rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .voice-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .voice-btn.listening { background: var(--danger); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    .voice-btn svg { width: 24px; height: 24px; }

    .manual-input { display: flex; gap: 10px; margin-top: 8px; }
    .manual-input input[type="text"] {
      flex: 1; padding: 12px 16px; border: 2px solid var(--border);
      border-radius: 10px; font-size: 1rem; outline: none;
    }
    .manual-input input[type="text"]:focus { border-color: var(--primary); }
    .manual-input button {
      background: var(--success); color: white; border: none; border-radius: 10px;
      padding: 0 20px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }

    .due-date-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .due-date-row label { font-size: 0.9rem; color: var(--muted); white-space: nowrap; }
    .due-date-row input[type="date"] {
      padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none;
    }

    .status { text-align: center; font-size: 0.9rem; color: var(--muted); min-height: 24px; margin-top: 8px; }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }

    .tasks-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .tasks-header h2 { font-size: 1.2rem; color: var(--text); }
    .task-count {
      background: var(--primary); color: white; font-size: 0.85rem;
      padding: 4px 12px; border-radius: 20px;
    }

    .task-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }

    .task-item {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: all 0.2s;
    }
    .task-item:hover { border-color: #c7d2fe; box-shadow: 0 2px 8px rgba(79,70,229,0.1); }
    .task-item.done { opacity: 0.65; }
    .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }

    .task-top { display: flex; align-items: flex-start; gap: 12px; }
    .task-top input[type="checkbox"] {
      width: 20px; height: 20px; margin-top: 2px; accent-color: var(--success); cursor: pointer;
    }
    .task-text { flex: 1; font-size: 1.05rem; line-height: 1.5; word-break: break-word; }

    .task-actions { display: flex; gap: 6px; }
    .task-actions button {
      background: none; border: none; cursor: pointer; padding: 4px; border-radius: 6px;
      color: var(--muted); transition: all 0.15s;
    }
    .task-actions button:hover { background: #e0e7ff; color: var(--primary); }
    .task-actions button.delete-btn:hover { background: #fee2e2; color: var(--danger); }

    .task-meta {
      display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.85rem;
      color: var(--muted); padding-right: 32px;
    }
    .task-meta span { display: flex; align-items: center; gap: 4px; }
    .due-date { color: var(--primary); font-weight: 500; }
    .due-date.overdue { color: var(--danger); font-weight: 600; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-state svg { width: 64px; height: 64px; margin-bottom: 12px; opacity: 0.4; }

    .clear-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; cursor: pointer;
      margin-top: 16px; width: 100%;
    }
    .clear-btn:hover { background: #fee2e2; border-color: #fecaca; color: var(--danger); }

    .loading { text-align: center; padding: 20px; color: var(--muted); }

    .edit-form { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .edit-form input[type="text"] {
      width: 100%; padding: 10px 12px; border: 2px solid var(--primary);
      border-radius: 8px; font-size: 1rem; outline: none;
    }
    .edit-form .edit-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .edit-form .edit-actions button {
      padding: 6px 14px; border: none; border-radius: 8px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    .edit-form .save-btn { background: var(--success); color: white; }
    .edit-form .cancel-btn { background: #e2e8f0; color: var(--text); }
    .edit-form .due-edit {
      display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted);
    }
    .edit-form .due-edit input {
      padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    }

    @media (max-width: 500px) {
      body { padding: 12px; }
      .card { padding: 16px; }
      header h1 { font-size: 1.5rem; }
      .tab { font-size: 0.85rem; padding: 10px 4px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 لیست کارهای روزانه</h1>
      <p>کارهایت را با صدا بگو · همگام با فضای ابری</p>
    </header>

    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="personal">
        شخصی <span class="count" id="count-personal">۰</span>
      </button>
      <button class="tab" data-cat="building">
        ساختمان <span class="count" id="count-building">۰</span>
      </button>
      <button class="tab" data-cat="company">
        شرکت <span class="count" id="count-company">۰</span>
      </button>
    </div>

    <div class="card">
      <div class="input-section">
        <button id="voiceBtn" class="voice-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <span id="voiceBtnText">ضبط صدا (بگو کارتو)</span>
        </button>

        <div class="manual-input">
          <input type="text" id="taskInput" placeholder="یا اینجا بنویس...">
          <button id="addBtn">افزودن</button>
        </div>

        <div class="due-date-row">
          <label for="dueDate">تاریخ انجام:</label>
          <input type="date" id="dueDate">
        </div>

        <div id="status" class="status"></div>
      </div>
    </div>

    <div class="card">
      <div class="tasks-header">
        <h2 id="sheetTitle">کارهای شخصی</h2>
        <span class="task-count" id="taskCount">۰ کار</span>
      </div>

      <div id="loading" class="loading">در حال بارگذاری از فضای ابری...</div>
      <ul class="task-list" id="taskList" style="display:none;"></ul>

      <div class="empty-state" id="emptyState" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <path d="M9 12h6M9 16h6"/>
        </svg>
        <p>هنوز کاری در این بخش ثبت نشده</p>
        <p style="font-size:0.85rem;margin-top:4px">با صدا یا نوشتن کار جدید اضافه کن</p>
      </div>

      <button class="clear-btn" id="clearBtn" style="display:none">پاک کردن کارهای انجام‌شده این بخش</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCV2XPdd4FLgHhP6Mhx3ucqg02gXuJ87Eo",
      authDomain: "my-to-do-list-b73c9.firebaseapp.com",
      projectId: "my-to-do-list-b73c9",
      storageBucket: "my-to-do-list-b73c9.firebasestorage.app",
      messagingSenderId: "760419200130",
      appId: "1:760419200130:web:825ed7823efa8ab9d4d89b",
      measurementId: "G-7PM55B37HP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const tasksRef = db.collection('tasks');

    const CATEGORIES = {
      personal: { id: 'personal', title: 'کارهای شخصی', label: 'شخصی' },
      building: { id: 'building', title: 'کارهای ساختمان', label: 'ساختمان' },
      company:  { id: 'company',  title: 'کارهای شرکت', label: 'شرکت' }
    };

    let tasks = [];
    let currentCategory = 'personal';
    let recognition = null;
    let isListening = false;
    let editingId = null;

    const voiceBtn = document.getElementById('voiceBtn');
    const voiceBtnText = document.getElementById('voiceBtnText');
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const dueDateInput = document.getElementById('dueDate');
    const statusEl = document.getElementById('status');
    const taskList = document.getElementById('taskList');
    const taskCount = document.getElementById('taskCount');
    const emptyState = document.getElementById('emptyState');
    const clearBtn = document.getElementById('clearBtn');
    const loadingEl = document.getElementById('loading');
    const sheetTitle = document.getElementById('sheetTitle');
    const tabs = document.getElementById('tabs');

    const today = new Date().toISOString().split('T')[0];
    dueDateInput.value = today;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'fa-IR';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        voiceBtn.classList.add('listening');
        voiceBtnText.textContent = 'در حال گوش دادن... صحبت کن';
        setStatus('گوش می‌دهم... کارتو بگو', '');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        if (transcript) {
          taskInput.value = transcript;
          setStatus(`شنیده شد: «${transcript}»`, 'success');
          setTimeout(() => addTask(), 600);
        }
      };

      recognition.onerror = (event) => {
        isListening = false;
        voiceBtn.classList.remove('listening');
        voiceBtnText.textContent = 'ضبط صدا (بگو کارتو)';
        if (event.error === 'no-speech') setStatus('صدایی شنیده نشد. دوباره امتحان کن.', 'error');
        else if (event.error === 'not-allowed') setStatus('دسترسی به میکروفون داده نشده.', 'error');
        else setStatus('خطا در تشخیص صدا: ' + event.error, 'error');
      };

      recognition.onend = () => {
        isListening = false;
        voiceBtn.classList.remove('listening');
        voiceBtnText.textContent = 'ضبط صدا (بگو کارتو)';
      };
    } else {
      voiceBtn.disabled = true;
      voiceBtnText.textContent = 'مرورگر پشتیبانی نمی‌کند';
    }

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function formatDateTime(iso) {
      if (!iso) return '—';
      const d = iso.toDate ? iso.toDate() : new Date(iso);
      return d.toLocaleDateString('fa-IR', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function isOverdue(dueDate) {
      if (!dueDate) return false;
      const t = new Date(); t.setHours(0,0,0,0);
      return new Date(dueDate + 'T00:00:00') < t;
    }

    function toPersianNum(n) {
      return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    function getFilteredTasks() {
      return tasks.filter(t => (t.category || 'personal') === currentCategory);
    }

    function updateTabCounts() {
      ['personal', 'building', 'company'].forEach(cat => {
        const count = tasks.filter(t => (t.category || 'personal') === cat && !t.done).length;
        const el = document.getElementById('count-' + cat);
        if (el) el.textContent = toPersianNum(count);
      });
    }

    function renderTasks() {
      loadingEl.style.display = 'none';
      taskList.style.display = 'flex';

      const filtered = getFilteredTasks();
      taskList.innerHTML = '';

      const active = filtered.filter(t => !t.done).length;
      const total = filtered.length;

      taskCount.textContent = total === 0 ? '۰ کار' : `${toPersianNum(active)} از ${toPersianNum(total)} باقی‌مانده`;
      sheetTitle.textContent = CATEGORIES[currentCategory].title;

      emptyState.style.display = total === 0 ? 'block' : 'none';
      clearBtn.style.display = filtered.some(t => t.done) ? 'block' : 'none';

      updateTabCounts();

      const sorted = [...filtered].sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
        if (a.dueDate) return -1;
        if (b.dueDate) return 1;
        const aTime = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt || 0);
        const bTime = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt || 0);
        return bTime - aTime;
      });

      sorted.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.dataset.id = task.id;

        if (editingId === task.id) {
          li.innerHTML = `
            <div class="edit-form">
              <input type="text" class="edit-text" value="${escapeHtml(task.text)}" />
              <div class="due-edit">
                <label>تاریخ انجام:</label>
                <input type="date" class="edit-due" value="${task.dueDate || today}" />
              </div>
              <div class="edit-actions">
                <button class="cancel-btn" data-action="cancel-edit">انصراف</button>
                <button class="save-btn" data-action="save-edit">ذخیره</button>
              </div>
            </div>
          `;
        } else {
          const overdueClass = !task.done && isOverdue(task.dueDate) ? ' overdue' : '';
          li.innerHTML = `
            <div class="task-top">
              <input type="checkbox" ${task.done ? 'checked' : ''} data-action="toggle">
              <span class="task-text">${escapeHtml(task.text)}</span>
              <div class="task-actions">
                <button data-action="edit" title="ویرایش">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </button>
                <button class="delete-btn" data-action="delete" title="حذف">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="task-meta">
              <span>📅 ثبت: ${formatDateTime(task.createdAt)}</span>
              <span class="due-date${overdueClass}">⏰ انجام تا: ${formatDate(task.dueDate)}</span>
            </div>
          `;
        }
        taskList.appendChild(li);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function addTask() {
      const text = taskInput.value.trim();
      if (!text) { setStatus('متنی وارد نشده!', 'error'); return; }

      try {
        setStatus('در حال ذخیره...', '');
        await tasksRef.add({
          text,
          done: false,
          category: currentCategory,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          dueDate: dueDateInput.value || today
        });
        taskInput.value = '';
        dueDateInput.value = today;
        setStatus('کار اضافه شد ✓', 'success');
        setTimeout(() => setStatus(''), 2000);
      } catch (err) {
        console.error(err);
        setStatus('خطا در ذخیره: ' + err.message, 'error');
      }
    }

    async function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      try { await tasksRef.doc(id).update({ done: !task.done }); }
      catch (err) { setStatus('خطا در به‌روزرسانی', 'error'); }
    }

    async function deleteTask(id) {
      try {
        await tasksRef.doc(id).delete();
        setStatus('کار حذف شد', 'success');
        setTimeout(() => setStatus(''), 1500);
      } catch (err) { setStatus('خطا در حذف', 'error'); }
    }

    async function saveEdit(id, li) {
      const textInput = li.querySelector('.edit-text');
      const dueInput = li.querySelector('.edit-due');
      const newText = textInput.value.trim();
      const newDue = dueInput.value || today;
      if (!newText) { setStatus('متن نمی‌تواند خالی باشد', 'error'); return; }

      try {
        await tasksRef.doc(id).update({ text: newText, dueDate: newDue });
        editingId = null;
        setStatus('ویرایش ذخیره شد ✓', 'success');
        setTimeout(() => setStatus(''), 1500);
      } catch (err) { setStatus('خطا در ذخیره ویرایش', 'error'); }
    }

    async function clearDone() {
      try {
        const batch = db.batch();
        getFilteredTasks().filter(t => t.done).forEach(t => batch.delete(tasksRef.doc(t.id)));
        await batch.commit();
        setStatus('کارهای انجام‌شده این بخش پاک شدند', 'success');
        setTimeout(() => setStatus(''), 1500);
      } catch (err) { setStatus('خطا در پاک‌سازی', 'error'); }
    }

    tasksRef.orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
      tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderTasks();
    }, (error) => {
      console.error(error);
      loadingEl.textContent = 'خطا در اتصال به فضای ابری';
      setStatus('خطا در بارگذاری داده‌ها', 'error');
    });

    voiceBtn.addEventListener('click', () => {
      if (!recognition) return;
      isListening ? recognition.stop() : recognition.start();
    });

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    tabs.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      currentCategory = btn.dataset.cat;
      editingId = null;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderTasks();
    });

    taskList.addEventListener('click', (e) => {
      const li = e.target.closest('.task-item');
      if (!li) return;
      const id = li.dataset.id;
      const action = e.target.closest('[data-action]')?.dataset.action;

      if (action === 'toggle' || e.target.type === 'checkbox') toggleTask(id);
      else if (action === 'delete') deleteTask(id);
      else if (action === 'edit') {
        editingId = id;
        renderTasks();
        setTimeout(() => {
          const input = document.querySelector(`[data-id="${id}"] .edit-text`);
          if (input) input.focus();
        }, 50);
      }
      else if (action === 'cancel-edit') { editingId = null; renderTasks(); }
      else if (action === 'save-edit') saveEdit(id, li);
    });

    taskList.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.classList.contains('edit-text')) {
        const li = e.target.closest('.task-item');
        if (li) saveEdit(li.dataset.id, li);
      }
      if (e.key === 'Escape' && editingId) { editingId = null; renderTasks(); }
    });

    clearBtn.addEventListener('click', clearDone);
  </script>
</body>
</html>
