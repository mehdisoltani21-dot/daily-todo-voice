<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لیست کارهای روزانه صوتی</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f0f9ff 100%);
      min-height: 100vh;
      color: var(--text);
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
      margin-bottom: 20px;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .voice-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .voice-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .voice-btn.listening {
      background: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .voice-btn svg {
      width: 24px;
      height: 24px;
    }

    .manual-input {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .manual-input input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .manual-input input[type="text"]:focus {
      border-color: var(--primary);
    }

    .manual-input button {
      background: var(--success);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .manual-input button:hover {
      opacity: 0.9;
    }

    .due-date-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .due-date-row label {
      font-size: 0.9rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .due-date-row input[type="date"] {
      padding: 8px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .due-date-row input[type="date"]:focus {
      border-color: var(--primary);
    }

    .status {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 24px;
      margin-top: 8px;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--success);
    }

    .tasks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .tasks-header h2 {
      font-size: 1.2rem;
      color: var(--text);
    }

    .task-count {
      background: var(--primary);
      color: white;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.2s;
    }

    .task-item:hover {
      border-color: #c7d2fe;
      box-shadow: 0 2px 8px rgba(79,70,229,0.1);
    }

    .task-item.done {
      opacity: 0.65;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .task-top input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      accent-color: var(--success);
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      font-size: 1.05rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .task-actions button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      color: var(--muted);
      transition: all 0.15s;
    }

    .task-actions button:hover {
      background: #fee2e2;
      color: var(--danger);
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--muted);
      padding-right: 32px;
    }

    .task-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .due-date {
      color: var(--primary);
      font-weight: 500;
    }

    .due-date.overdue {
      color: var(--danger);
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 16px;
      width: 100%;
    }

    .clear-btn:hover {
      background: #fee2e2;
      border-color: #fecaca;
      color: var(--danger);
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--muted);
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }
      .card {
        padding: 16px;
      }
      header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 لیست کارهای روزانه</h1>
      <p>کارهایت را با صدا بگو، لیست می‌شوند · همگام با فضای ابری</p>
    </header>

    <div class="card">
      <div class="input-section">
        <button id="voiceBtn" class="voice-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <span id="voiceBtnText">ضبط صدا (بگو کارتو)</span>
        </button>

        <div class="manual-input">
          <input type="text" id="taskInput" placeholder="یا اینجا بنویس...">
          <button id="addBtn">افزودن</button>
        </div>

        <div class="due-date-row">
          <label for="dueDate">تاریخ انجام:</label>
          <input type="date" id="dueDate">
        </div>

        <div id="status" class="status"></div>
      </div>
    </div>

    <div class="card">
      <div class="tasks-header">
        <h2>کارهای من</h2>
        <span class="task-count" id="taskCount">۰ کار</span>
      </div>

      <div id="loading" class="loading">در حال بارگذاری از فضای ابری...</div>
      <ul class="task-list" id="taskList" style="display:none;"></ul>

      <div class="empty-state" id="emptyState" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <path d="M9 12h6M9 16h6"/>
        </svg>
        <p>هنوز کاری ثبت نشده</p>
        <p style="font-size:0.85rem;margin-top:4px">با صدا یا نوشتن کار جدید اضافه کن</p>
      </div>

      <button class="clear-btn" id="clearBtn" style="display:none">پاک کردن کارهای انجام‌شده</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    // ---------- Firebase Config ----------
    const firebaseConfig = {
      apiKey: "AIzaSyCV2XPdd4FLgHhP6Mhx3ucqg02gXuJ87Eo",
      authDomain: "my-to-do-list-b73c9.firebaseapp.com",
      projectId: "my-to-do-list-b73c9",
      storageBucket: "my-to-do-list-b73c9.firebasestorage.app",
      messagingSenderId: "760419200130",
      appId: "1:760419200130:web:825ed7823efa8ab9d4d89b",
      measurementId: "G-7PM55B37HP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const tasksRef = db.collection('tasks');

    // ---------- State ----------
    let tasks = [];
    let recognition = null;
    let isListening = false;

    // ---------- Elements ----------
    const voiceBtn = document.getElementById('voiceBtn');
    const voiceBtnText = document.getElementById('voiceBtnText');
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const dueDateInput = document.getElementById('dueDate');
    const statusEl = document.getElementById('status');
    const taskList = document.getElementById('taskList');
    const taskCount = document.getElementById('taskCount');
    const emptyState = document.getElementById('emptyState');
    const clearBtn = document.getElementById('clearBtn');
    const loadingEl = document.getElementById('loading');

    // Set default due date to today
    const today = new Date().toISOString().split('T')[0];
    dueDateInput.value = today;

    // ---------- Speech Recognition ----------
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'fa-IR';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        voiceBtn.classList.add('listening');
        voiceBtnText.textContent = 'در حال گوش دادن... صحبت کن';
        setStatus('گوش می‌دهم... کارتو بگو', '');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        if (transcript) {
          taskInput.value = transcript;
          setStatus(`شنیده شد: «${transcript}»`, 'success');
          setTimeout(() => addTask(), 600);
        }
      };

      recognition.onerror = (event) => {
        isListening = false;
        voiceBtn.classList.remove('listening');
        voiceBtnText.textContent = 'ضبط صدا (بگو کارتو)';
        if (event.error === 'no-speech') {
          setStatus('صدایی شنیده نشد. دوباره امتحان کن.', 'error');
        } else if (event.error === 'not-allowed') {
          setStatus('دسترسی به میکروفون داده نشده. لطفاً اجازه بده.', 'error');
        } else {
          setStatus('خطا در تشخیص صدا: ' + event.error, 'error');
        }
      };

      recognition.onend = () => {
        isListening = false;
        voiceBtn.classList.remove('listening');
        voiceBtnText.textContent = 'ضبط صدا (بگو کارتو)';
      };
    } else {
      voiceBtn.disabled = true;
      voiceBtnText.textContent = 'مرورگر پشتیبانی نمی‌کند';
      setStatus('مرورگر شما از تشخیص صدا پشتیبانی نمی‌کند. از Chrome یا Edge استفاده کنید.', 'error');
    }

    // ---------- Functions ----------
    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('fa-IR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    function formatDateTime(iso) {
      if (!iso) return '—';
      const d = iso.toDate ? iso.toDate() : new Date(iso);
      return d.toLocaleDateString('fa-IR', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function isOverdue(dueDate) {
      if (!dueDate) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(dueDate + 'T00:00:00');
      return due < today;
    }

    function toPersianNum(n) {
      const map = '۰۱۲۳۴۵۶۷۸۹';
      return String(n).replace(/\d/g, d => map[d]);
    }

    function renderTasks() {
      loadingEl.style.display = 'none';
      taskList.style.display = 'flex';

      taskList.innerHTML = '';
      const active = tasks.filter(t => !t.done).length;
      const total = tasks.length;

      taskCount.textContent = total === 0
        ? '۰ کار'
        : `${toPersianNum(active)} از ${toPersianNum(total)} باقی‌مانده`;

      emptyState.style.display = total === 0 ? 'block' : 'none';
      clearBtn.style.display = tasks.some(t => t.done) ? 'block' : 'none';

      const sorted = [...tasks].sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
        if (a.dueDate) return -1;
        if (b.dueDate) return 1;
        const aTime = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt || 0);
        const bTime = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt || 0);
        return bTime - aTime;
      });

      sorted.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.dataset.id = task.id;

        const overdueClass = !task.done && isOverdue(task.dueDate) ? ' overdue' : '';

        li.innerHTML = `
          <div class="task-top">
            <input type="checkbox" ${task.done ? 'checked' : ''} data-action="toggle">
            <span class="task-text">${escapeHtml(task.text)}</span>
            <div class="task-actions">
              <button data-action="delete" title="حذف">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="task-meta">
            <span>📅 ثبت: ${formatDateTime(task.createdAt)}</span>
            <span class="due-date${overdueClass}">⏰ انجام تا: ${formatDate(task.dueDate)}</span>
          </div>
        `;

        taskList.appendChild(li);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function addTask() {
      const text = taskInput.value.trim();
      if (!text) {
        setStatus('متنی وارد نشده!', 'error');
        return;
      }

      try {
        setStatus('در حال ذخیره...', '');
        await tasksRef.add({
          text: text,
          done: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          dueDate: dueDateInput.value || today
        });

        taskInput.value = '';
        dueDateInput.value = today;
        setStatus('کار اضافه شد ✓', 'success');
        setTimeout(() => setStatus(''), 2000);
      } catch (err) {
        console.error(err);
        setStatus('خطا در ذخیره: ' + err.message, 'error');
      }
    }

    async function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      try {
        await tasksRef.doc(id).update({ done: !task.done });
      } catch (err) {
        setStatus('خطا در به‌روزرسانی', 'error');
      }
    }

    async function deleteTask(id) {
      try {
        await tasksRef.doc(id).delete();
        setStatus('کار حذف شد', 'success');
        setTimeout(() => setStatus(''), 1500);
      } catch (err) {
        setStatus('خطا در حذف', 'error');
      }
    }

    async function clearDone() {
      try {
        const batch = db.batch();
        tasks.filter(t => t.done).forEach(t => {
          batch.delete(tasksRef.doc(t.id));
        });
        await batch.commit();
        setStatus('کارهای انجام‌شده پاک شدند', 'success');
        setTimeout(() => setStatus(''), 1500);
      } catch (err) {
        setStatus('خطا در پاک‌سازی', 'error');
      }
    }

    // Real-time listener
    tasksRef.orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
      tasks = snapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));
      renderTasks();
    }, (error) => {
      console.error(error);
      loadingEl.textContent = 'خطا در اتصال به فضای ابری. قوانین امنیتی Firestore را چک کن.';
      setStatus('خطا در بارگذاری داده‌ها', 'error');
    });

    // ---------- Events ----------
    voiceBtn.addEventListener('click', () => {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });

    addBtn.addEventListener('click', addTask);

    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    taskList.addEventListener('click', (e) => {
      const li = e.target.closest('.task-item');
      if (!li) return;
      const id = li.dataset.id;
      const action = e.target.closest('[data-action]')?.dataset.action;

      if (action === 'toggle' || e.target.type === 'checkbox') {
        toggleTask(id);
      } else if (action === 'delete') {
        deleteTask(id);
      }
    });

    clearBtn.addEventListener('click', clearDone);
  </script>
</body>
</html>
